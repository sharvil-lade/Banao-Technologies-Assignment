[project]
name = "vireo"
version = "1.0.0"
description = "Vireo Audio support-ticket refund reconciliation, AI-assisted analysis, and business-impact pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ai = ["anthropic>=0.40"]  # only needed for backend="anthropic" (tier 2 falls back to a shipped label cache otherwise)

[project.scripts]
vireo-pipeline = "vireo.pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vireo"]
